<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | ShivaGroups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./src/styles/main.css">
    <style>
        body {
            background: radial-gradient(circle at center, #00509d 0%, #003366 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        /* Decorative background glow */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.3;
            border-radius: 50%;
            top: 20%;
            left: 20%;
            z-index: 1;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #00509d;
            filter: blur(120px);
            opacity: 0.4;
            border-radius: 50%;
            bottom: 20%;
            right: 20%;
            z-index: 1;
            animation: floatGlow 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .error-container {
            position: relative;
            z-index: 10;
            max-width: 550px;
            width: 100%;
            text-align: center;
            padding: 3.5rem 2rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 8rem;
            font-family: var(--font-heading);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--white) 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -2px;
            animation: pulseCode 3s ease-in-out infinite;
        }

        @keyframes pulseCode {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--white);
        }

        .error-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-error {
            padding: 0.9rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-family: var(--font-main);
            text-decoration: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn-error-primary {
            background: var(--white);
            color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .btn-error-primary:hover {
            background: var(--accent);
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 168, 232, 0.4);
        }

        .btn-error-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-error-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <div class="error-actions">
            <a href="./index.html" class="btn-error btn-error-primary">Go Back Home</a>
            <a href="./projects.html" class="btn-error btn-error-secondary">View Our Projects</a>
        </div>
    </div>
</body>
</html>
