<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | ShivaGroups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/navbar.css">
    <link rel="stylesheet" href="./src/styles/footer.css">
    <style>
        .detail-hero {
            padding: 12rem 2rem 6rem;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), var(--bg-hero);
            background-size: cover;
            background-position: center;
            color: var(--white);
            text-align: center;
        }
        .detail-container {
            max-width: 1200px;
            margin: -4rem auto 4rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }
        .detail-card {
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 3rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .project-info h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
        }
        .info-list {
            list-style: none;
            margin-top: 2rem;
        }
        .info-list li {
            padding: 1rem 0;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
        }
        .info-list li strong {
            color: var(--gray-800);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: transform 0.3s;
        }
        .back-btn:hover {
            transform: translateX(-5px);
        }
        @media (max-width: 992px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 576px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .detail-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header id="navbar-placeholder"></header>

    <section id="project-hero" class="detail-hero">
        <h1 id="project-title" class="animate-fade">Project Name</h1>
        <p id="project-category" class="animate-fade">Category</p>
    </section>

    <div class="detail-container">
        <a href="projects.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Projects
        </a>
        <div class="detail-card glass">
            <div class="detail-grid">
                <div class="project-gallery">
                    <div id="gallery-grid" class="gallery-grid">
                        <!-- Gallery items will be injected here -->
                    </div>
                </div>
                <div class="project-info">
                    <h2 id="info-title">About Project</h2>
                    <p id="project-desc">Project description goes here...</p>
                    <ul class="info-list">
                        <li><strong>Location</strong> <span id="project-loc">City</span></li>
                        <li><strong>Client</strong> <span id="project-client">Name</span></li>
                        <li><strong>Area</strong> <span id="project-area">Sq. Ft.</span></li>
                        <li><strong>Status</strong> <span id="project-status">In-Progress</span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>

    <script type="module">
        import { Navbar } from './src/components/Navbar.js';
        import { Footer } from './src/components/Footer.js';
        import { projectsData } from './src/data/projects.js';

        document.querySelector('#navbar-placeholder').innerHTML = Navbar;
        document.querySelector('#footer-placeholder').innerHTML = Footer;

        // Custom Mobile Toggle for detailing page
        const setupMobileToggle = () => {
            const toggle = document.querySelector('.mobile-toggle');
            const navLinks = document.querySelector('.nav-links');
            if (toggle && navLinks) {
                toggle.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    toggle.classList.toggle('active');
                });
            }
        };
        setupMobileToggle();

        // Load Project Data
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = projectsData.find(p => p.id === projectId);

        if (project) {
            document.title = `${project.title} | ShivaGroups`;
            document.getElementById('project-title').innerText = project.title;
            document.getElementById('project-category').innerText = project.category;
            document.getElementById('project-hero').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${project.mainImage}')`;
            document.getElementById('project-desc').innerText = project.description;
            document.getElementById('project-loc').innerText = project.location;
            document.getElementById('project-client').innerText = project.client;
            document.getElementById('project-area').innerText = project.area;
            document.getElementById('project-status').innerText = project.status;

            const galleryHtml = project.gallery.map(img => `
                <div class="gallery-item">
                    <img src="${img}" alt="${project.title}">
                </div>
            `).join('');
            document.getElementById('gallery-grid').innerHTML = galleryHtml;
        } else {
            window.location.href = 'projects.html';
        }
    </script>
</body>
</html>
